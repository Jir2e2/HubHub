server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $csharp_backend "http://csharp-service:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $csharp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /scan {
        resolver 127.0.0.11 valid=30s;
        set $python_backend "http://hubhub-python:5002";
        proxy_pass $python_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}